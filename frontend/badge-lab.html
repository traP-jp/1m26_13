<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge Lab — 本番生成器の比較</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.6 system-ui,
          sans-serif;
        color: #dfe7f0;
        background: #0c111b;
        --badge-size: 160px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 1300px;
        padding: 24px;
        margin: auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 500;
      }
      p {
        color: #aab9cd;
      }
      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
        background: #162030;
        border: 1px solid #42516a;
        border-radius: 6px;
        padding: 8px;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #b6d5ff;
        outline-offset: 3px;
      }
      .controls {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin: 20px 0;
      }
      textarea {
        display: block;
        width: 100%;
        height: 210px;
        margin: 12px 0;
      }
      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }
      .art {
        display: grid;
        width: 100%;
        min-height: 200px;
        place-items: center;
        padding: 14px;
        background: #0c111b;
      }
      .art svg {
        width: var(--badge-size);
        height: var(--badge-size);
        max-width: 100%;
      }
      article h2 {
        font-size: 14px;
        font-weight: 500;
        margin: 8px 0 3px;
      }
      article p {
        font-size: 12px;
        margin: 0;
      }
      dialog {
        background: #0c111b;
        color: #dfe7f0;
        border: 1px solid #42516a;
        border-radius: 12px;
        padding: 20px;
        width: min(480px, 94vw);
        max-height: 90vh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #000a;
      }
      #detail-art svg {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Badge Lab — 本番と同じ生成器で比較</h1>
    <p>開発専用。APIへのアクセス・保存・送信はしません。下の名前と班は表示確認用の仮データです。</p>
    <div class="controls">
      <button id="accent" type="button">差し色を切り替える</button>
      <label><input id="related" type="checkbox" checked /> 共通語で枠を似せる</label>
      <label
        >共催の枠
        <select id="split">
          <option value="sectors">等角度で分割</option>
          <option value="alternating">交互に同じ角度で分割</option>
        </select></label
      >
      <label
        >実サイズ
        <select id="size">
          <option value="56">56px</option>
          <option value="96">96px</option>
          <option value="160" selected>160px</option>
        </select></label
      >
    </div>
    <details>
      <summary>名前・班を入れ替える（1行＝講習会名 | 班名,班名）</summary>
      <textarea id="samples" aria-label="比較用の講習会名と班"></textarea
      ><button id="apply" type="button">この一覧で比較</button>
    </details>
    <p id="status" role="status"></p>
    <main id="gallery"></main>
    <dialog id="detail">
      <button id="close" type="button">閉じる</button>
      <h2 id="detail-title"></h2>
      <div id="detail-art"></div>
      <p id="detail-info"></p>
    </dialog>
    <script type="module" src="/src/dev/badgeLab.ts"></script>
  </body>
</html>
